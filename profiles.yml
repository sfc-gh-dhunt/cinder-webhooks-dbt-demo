# =====================================================================================
# profiles.yml — Snowflake-native form
# =====================================================================================
# This file MUST live inside the project directory, alongside dbt_project.yml. It is
# bundled into the deployed project by `snow dbt deploy`. It is NOT read from ~/.dbt/.
#
# There are deliberately NO authentication fields here — no password, no authenticator,
# no private_key_path, no token. When the project runs inside Snowflake, authentication
# is the Snowflake session's, not dbt's. Including credentials here would at best be
# ignored and at worst leak a secret into a version-controlled file.
#
# There are also no env_var() calls. Snowflake-native dbt does not support env_var().
#
# The account field is intentionally omitted for the same reason: the deployed project
# runs inside the account it was deployed to.
#
# NO `role:` EITHER, AND THIS ONE IS EARNED. Pinning a role here looks harmless and then
# breaks CI in a way that is hard to read. `snow dbt deploy` validates EVERY output in this
# file against the role that is connecting — not just the one being used. So a CI service
# user that correctly holds only the CI role fails on an output naming the production role:
#
#   Found following errors in profiles.yml. Please fix them before proceeding:
#    * Role 'CINDER_DBT_PROD_ROLE' does not exist or is not accessible.
#
# The role is part of the session, exactly like the credentials, so it belongs with them —
# outside this file. Omitted, each caller runs as whatever role it connected with: the
# deploy user as production, the CI user as CI, a developer as their own. One output serves
# all three, and least-privilege separation stays intact rather than being contradicted by
# a hardcoded name.
#
# ONE OUTPUT, NOT ONE PER ENVIRONMENT. There is nothing left to vary. Environment separation
# here is by SCHEMA, applied through the cinder_schema_prefix var in
# macros/generate_schema_name.sql, so a pull request builds into PR123_MARTS while production
# builds into MARTS — with the same code and the same profile.
# =====================================================================================

cinder_webhooks:
  target: default
  outputs:
    default:
      type: snowflake
      database: CINDER_ANALYTICS
      schema: PUBLIC          # every model sets its own schema explicitly; see dbt_project.yml
      warehouse: CINDER_DEMO_WH
      threads: 8
