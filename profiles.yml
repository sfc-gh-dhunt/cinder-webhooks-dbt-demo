# =====================================================================================
# profiles.yml — Snowflake-native form
# =====================================================================================
# This file MUST live inside the project directory, alongside dbt_project.yml. It is
# bundled into the deployed project by `snow dbt deploy`. It is NOT read from ~/.dbt/.
#
# There are deliberately NO authentication fields here — no password, no authenticator,
# no private_key_path, no token. When the project runs inside Snowflake, authentication
# is the Snowflake session's, not dbt's. Including credentials here would at best be
# ignored and at worst leak a secret into a version-controlled file.
#
# There are also no env_var() calls. Snowflake-native dbt does not support env_var().
#
# The account field is intentionally omitted for the same reason: the deployed project
# runs inside the account it was deployed to.
#
# `role:` IS REQUIRED, unlike the credentials, and the interaction with CI is worth knowing
# before it bites. `snow dbt deploy` rejects a profile without it:
#
#   Missing required fields: role in target default
#
# and it validates EVERY output against the role that is CONNECTING — not just the one in
# use. So a role named here must be accessible to every identity that deploys this project.
# A CI service user correctly holding only the CI role fails on an output naming production:
#
#   * Role 'CINDER_DBT_PROD_ROLE' does not exist or is not accessible.
#
# The tempting fixes are both wrong. Granting production to the CI user destroys the
# separation the two users exist to create. Naming the CI role here means production deploys
# as CI. Neither trade is worth making to satisfy a validator.
#
# So this file names the PRODUCTION role — correct for the deployed production object — and
# the CI workflow rewrites this one line before deploying its throwaway project, so that
# project runs as the CI role. The rewrite happens in the runner's checkout and is never
# committed. See "Point the profile at the CI role" in .github/workflows/ci.yml.
#
# ONE OUTPUT, NOT ONE PER ENVIRONMENT. A second output would not help: deploy validates all
# of them regardless of which is selected, so an unused `ci` output fails a production deploy
# just as surely. Environment separation here is by SCHEMA, applied through the
# cinder_schema_prefix var in macros/generate_schema_name.sql — a pull request builds into
# PR123_MARTS while production builds into MARTS, from identical code.
#
# `schema:` IS NOT JUST A FALLBACK, and this used to say PUBLIC on the reasoning that it was.
# Every model sets its own schema, so dbt never places anything here — but this is also the
# SESSION's schema, and an agent evaluation runs FROM the current schema: it needs USAGE there
# along with CREATE FILE FORMAT and CREATE TASK. Pointed at PUBLIC, which no project role is
# granted on, the evaluation failed with
#
#   Failed to validate query_text: Schema 'CINDER_ANALYTICS.PUBLIC' does not exist or not authorized
#
# which reads as a problem with the evaluation data rather than with the session. So it names a
# schema the roles actually hold. CI rewrites this line to the pull request's own schema for the
# same reason it rewrites the role — see .github/workflows/ci.yml.
# =====================================================================================

cinder_webhooks:
  target: default
  outputs:
    default:
      type: snowflake
      role: CINDER_DBT_PROD_ROLE   # rewritten by CI; see the note above
      database: CINDER_ANALYTICS
      schema: SEMANTIC        # see below; every model still sets its own schema explicitly
      warehouse: CINDER_DEMO_WH
      threads: 8
