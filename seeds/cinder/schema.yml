version: 2

seeds:
  - name: seed_cinder_job_actioned
    description: >
      Synthetic `job.actioned` webhook deliveries — one row per job lifecycle movement.

      Every job in the seed set gets a `created` action followed by a variable number of
      movements, so "how many queue changes does a job undergo before it closes" has a
      real distribution rather than a constant.

      Deliberately exercises several variations the published schema does not show: job
      categories outside the documented enum, `job.created_at` present on this event, and
      payloads where the `entity` object is absent entirely. Also covers all five action
      sources — including `auto`, `api` and `agent`, which carry neither a user nor a
      workflow — and one duplicate delivery.

      Generated by `seeds/generate_seeds.py`. All data invented.
    columns:
      - name: event
        description: Always `job.actioned`.
        tests:
          - not_null
          - accepted_values:
              values: ['job.actioned']
      - name: payload
        description: >
          Webhook payload as a JSON string. Seeds cannot carry a VARIANT, so the base
          layer parses it.
        tests:
          - not_null
      - name: import_ts
        description: Simulated ingestion wall-clock time.
        tests:
          - not_null

  - name: seed_cinder_job_closed
    description: >
      Synthetic `job.closed` webhook deliveries — one row per closed job, each carrying
      the decisions that resolved it.

      With `decision.created` out of scope, the `decisions` array inside these payloads is
      the only decision surface in the project, so this seed carries the shapes every
      decision-grain metric depends on: human and automated decisions, multi-review jobs
      with more than one decision, policies with a `parent_id` hierarchy and nested
      per-policy enforcement actions, a reviewed-and-cleared outcome carrying only a
      non-violating policy, the wider `category` enum this event uses, and one duplicate
      delivery.

      Not every job in the seed set closes. An open backlog is normal, and it keeps the
      closure rate a real number rather than 100%.

      Generated by `seeds/generate_seeds.py`. All data invented.
    columns:
      - name: event
        description: Always `job.closed`.
        tests:
          - not_null
          - accepted_values:
              values: ['job.closed']
      - name: payload
        description: Webhook payload as a JSON string, including the `decisions` array.
        tests:
          - not_null
      - name: import_ts
        description: Simulated ingestion wall-clock time.
        tests:
          - not_null

  - name: seed_cinder_policy_areas
    description: >
      Lookup from a parent policy id to its display name.

      This seed exists because the webhook surface cannot supply it. Payloads carry a
      policy's `parent_id` but never the parent's name, and parents are grouping nodes rather
      than the things reviewers pick — so they are rarely applied directly and their names
      usually cannot be recovered from the event stream at all.

      Without this mapping, policy distribution can only be reported at leaf level, where it
      fragments into unreadably thin slices.

      TO MAINTAIN THIS IN A LIVE DEPLOYMENT: populate it from Cinder's policies API, which
      does expose the full tree. Filling it in by hand also works and takes minutes. Any
      parent id absent from here degrades gracefully — the policy falls back to its own name
      and `policy_parent_name_resolved` reports false, so the gap stays visible.
    columns:
      - name: policy_area_id
        description: Parent policy id, matching `parent_id` on policies in the payload.
        tests:
          - unique
          - not_null
      - name: policy_area_name
        description: Display name for the policy area.
        tests:
          - not_null
