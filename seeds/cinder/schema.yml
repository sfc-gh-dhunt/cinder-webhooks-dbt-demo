version: 2

seeds:
  - name: seed_cinder_job_actioned
    description: >
      Synthetic `job.actioned` webhook deliveries.

      Covers both documented variants (a human reviewer and an automated workflow), the
      sources that carry neither (`auto`, `api`, `agent`), empty notes, four entity
      schemas including one the models have never seen, and one duplicate delivery.

      Generated by `seeds/generate_seeds.py`. All data invented.
    columns:
      - name: event
        description: Always `job.actioned`.
        tests:
          - not_null
          - accepted_values:
              values: ['job.actioned']
      - name: payload
        description: >
          Webhook payload as a JSON string. Seeds cannot carry a VARIANT, so the base
          layer parses it.
        tests:
          - not_null
      - name: import_ts
        description: Simulated ingestion wall-clock time.
        tests:
          - not_null

  - name: seed_cinder_job_closed
    description: >
      Synthetic `job.closed` webhook deliveries.

      Built from the decisions in `seed_cinder_decision_created`, so the reconciliation
      test between closures and decisions has real data to check. Includes one closure
      with no matching `decision.created` — which is expected in production, not a defect
      — the wider `category` enum that this event uses, and one duplicate delivery.

      Generated by `seeds/generate_seeds.py`. All data invented.
    columns:
      - name: event
        description: Always `job.closed`.
        tests:
          - not_null
          - accepted_values:
              values: ['job.closed']
      - name: payload
        description: Webhook payload as a JSON string, including the `decisions` array.
        tests:
          - not_null
      - name: import_ts
        description: Simulated ingestion wall-clock time.
        tests:
          - not_null

  - name: seed_cinder_decision_created
    description: >
      Synthetic `decision.created` webhook deliveries.

      The widest of the three. Covers eleven decision types across human and automated
      sources, classifier predictions, point updates, a multi-review agreement, a
      multi-review escalation, an appeal resolution with a two-deep `previous_decision`
      chain, a non-violating "reviewed and cleared" outcome, a policy with a null
      `customer_ref`, and one duplicate delivery.

      Generated by `seeds/generate_seeds.py`. All data invented.
    columns:
      - name: event
        description: Always `decision.created`.
        tests:
          - not_null
          - accepted_values:
              values: ['decision.created']
      - name: payload
        description: Webhook payload as a JSON string.
        tests:
          - not_null
      - name: import_ts
        description: Simulated ingestion wall-clock time.
        tests:
          - not_null
