version: 2

models:

  # =====================================================================================
  # Dimensions
  # =====================================================================================
  # Every dimension here is OBSERVED, not reference. They are assembled from fragments
  # carried on events, because the webhook surface has no dimension feed. Two consequences
  # apply to all of them and are not restated on each:
  #
  #   1. They contain only members that have had activity. A queue, policy or enforcement
  #      action configured in Cinder but never used will not appear.
  #   2. Mutable attributes reflect the most recent observation, not a full history. These
  #      are type-1 dimensions. If point-in-time attribution matters, read the snapshot the
  #      fact carries rather than joining here.

  - name: dim_queue
    description: >
      Review queues, assembled from the queue fragments on both events.

      The slug is the business key because it is the only queue identifier the webhooks
      expose. A queue renamed in Cinder such that its slug changes appears here as two
      queues, and history will not follow the rename.
    columns:
      - name: queue_key
        description: Surrogate key.
        tests: [unique, not_null]
      - name: queue_slug
        description: Queue slug — the business key.
        tests: [unique, not_null]
      - name: queue_name
        description: Readable label derived from the slug, for the semantic layer.
      - name: queue_is_multi_review
        description: >
          Whether the queue requires multiple reviews. A mutable setting, taken from the
          most recent observation.

  - name: dim_policy
    description: >
      Moderation policies, with hierarchy.

      Policies form a tree — broad areas at the top, specific violations beneath — exposed
      on the wire as a `parent_id`. Distribution reported at leaf level fragments into thin
      slices; rolled up to the parent it becomes readable. Both levels are available.

      Cinder sends the parent's id but not its name, so a parent name is only resolvable
      when that parent has itself been applied to some decision. Where it cannot be
      resolved, the name is null and `policy_parent_name_resolved` is false;
      `policy_group_name` is always usable because it falls back to the policy's own name.
    columns:
      - name: policy_key
        tests: [unique, not_null]
      - name: policy_id
        tests: [unique, not_null]
      - name: policy_name
        tests: [not_null]
      - name: policy_parent_id
        description: Parent policy id. Null for roots.
      - name: policy_parent_name
        description: >
          Parent policy name, resolved from observed policies. Null when the parent has
          never been applied directly.
      - name: policy_group_name
        description: >
          Always-usable grouping label: the parent's name where known, otherwise the
          policy's own name. Avoids a null bucket in every distribution.
        tests: [not_null]
      - name: policy_severity_class
        description: >
          One of `illegal`, `violating`, `non_violating`. The three cuts that get asked for.
        tests:
          - not_null
          - accepted_values:
              values: ['illegal', 'violating', 'non_violating']
      - name: policy_is_non_violating
        description: >
          A non-violating policy records a reviewed-and-cleared outcome. Counting "has a
          policy" as "is a violation" overstates enforcement — this is the flag that
          prevents it.

  - name: dim_reviewer
    description: >
      Human moderators. Automated decisions and workflow-driven actions carry no user, so
      they are absent here by design — a synthetic "unknown" member would become the busiest
      reviewer in the business and corrupt every per-reviewer metric.

      Email is the business key, lowercased; there is no user id in the webhook surface.

      Vendor segmentation is parsed from group names by convention, not read from a field.
      It fails safe: an unmatched name leaves the vendor null and `is_outsourced` false.
    columns:
      - name: reviewer_key
        tests: [unique, not_null]
      - name: reviewer_email
        tests: [unique, not_null]
      - name: reviewer_name
      - name: reviewer_group_array
        description: Group membership as at the latest observation. A point-in-time snapshot.
      - name: vendor_name
        description: >
          Outsourced-moderation vendor, parsed by naming convention. Null for in-house
          reviewers and for any group name that does not match the convention.
      - name: staffing_model
        description: >
          Vendor name where known, otherwise `In-house`. Always populated, so staffing
          breakdowns have no null bucket.
        tests: [not_null]
      - name: is_outsourced
        tests: [not_null]

  - name: dim_entity
    description: >
      Entities under review — accounts, posts, images, and any schema defined in Cinder.

      The attribute bag is kept as a VARIANT on purpose. Attribute keys vary by
      `entity_schema`, so flattening to fixed columns would break on the first new schema
      and silently discard unmapped attributes until then. A few recurring attributes are
      surfaced as nullable convenience columns; each is null for schemas that do not define
      it, which is correct rather than missing.

      Keyed on (entity_schema, entity_id) because ids are only unique within a schema.
    columns:
      - name: entity_key
        tests: [unique, not_null]
      - name: entity_schema
        tests: [not_null]
      - name: entity_id
        tests: [not_null]
      - name: entity_attributes
        description: The full attribute bag. Query with `entity_attributes:slug::varchar`.
      - name: entity_username
        description: Present only for schemas that define it. Null elsewhere, correctly.
      - name: has_attributes
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: ['entity_schema', 'entity_id']

  - name: dim_workflow
    description: >
      Automated workflows, from `job.actioned` only.

      `job.closed` does not name the workflow behind an automated decision — its
      `source.type` says the decision was automated but not which workflow made it. So this
      dimension covers workflow-driven job actions and cannot be joined to decisions. That
      asymmetry is a property of the webhook surface, and it is worth knowing before anyone
      promises a "decisions by workflow" breakdown.
    columns:
      - name: workflow_key
        tests: [unique, not_null]
      - name: workflow_id
        tests: [unique, not_null]
      - name: workflow_name
      - name: workflow_rule_name
        description: >
          The most recent rule to fire, not the only one. `distinct_rule_count` tells you
          whether it is the whole story.

  - name: dim_enforcement_action
    description: >
      Enforcement actions, derived entirely from observed usage — the wire format carries
      bare slugs with no id, name or severity.

      The severity ranking and category grouping are a LOCAL CONVENTION defined in this
      project, not something Cinder supplies. This is the one model you are expected to edit
      to match your own enforcement ladder. Unrecognised actions fall to rank 0 and category
      `unclassified` rather than being guessed into a bucket.
    columns:
      - name: enforcement_action_key
        tests: [unique, not_null]
      - name: enforcement_action_slug
        tests: [unique, not_null]
      - name: enforcement_severity_rank
        description: Local convention. Higher is more severe. 0 for unrecognised actions.
        tests:
          - not_null
          - dbt_utils.accepted_range: { min_value: 0, max_value: 5, inclusive: true }
      - name: enforcement_category
        tests:
          - accepted_values:
              values: ['none', 'advisory', 'visibility', 'content', 'account', 'unclassified']
      - name: is_recognised_action
        description: >
          False when the action is not in this project's ladder — a signal to update the
          ladder, not a data defect.
        tests: [not_null]

  # =====================================================================================
  # Facts
  # =====================================================================================

  - name: fct_decisions
    description: >
      One row per decision recorded on a closed job. The decision grain.

      Use this for handle time, automation share and enforcement volume. Do NOT sum
      decision counts from `fct_decision_policies` — a multi-policy decision appears there
      more than once by design.
    columns:
      - name: decision_sk
        tests: [unique, not_null]
      - name: job_closure_event_sk
        tests: [not_null]
      - name: queue_key
        description: Null only if the queue is missing from the dimension, which should not happen.
        tests:
          - relationships:
              to: ref('dim_queue')
              field: queue_key
      - name: reviewer_key
        description: >
          Null for automated decisions, by design. The relationship test tolerates null and
          checks only that non-null keys resolve.
        tests:
          - relationships:
              to: ref('dim_reviewer')
              field: reviewer_key
      - name: entity_key
        tests:
          - relationships:
              to: ref('dim_entity')
              field: entity_key
      - name: decided_at
        tests: [not_null]
      - name: decision_count
        description: Always 1. Sum it for decision volume.
        tests: [not_null]
      - name: handle_time_seconds
        description: Job creation to decision. Null when creation time is absent.
      - name: is_automated
        tests: [not_null]
      - name: is_cleared_outcome
        description: >
          Policies were applied but all of them are non-violating — "we looked and it was
          fine". Counting these as enforcement overstates the numbers.
        tests: [not_null]
      - name: is_final_decision
        description: Filter on this for one decision per closed job.
        tests: [not_null]

  - name: fct_decision_policies
    description: >
      One row per decision per applied policy. The grain for policy distribution.

      Two ways to count, and the choice is not cosmetic. `policy_application_count` is raw
      volume and sums to more than the decision count on multi-policy decisions.
      `decision_count_allocated` is fractional and sums back to the true decision count.
      Use the first for "how often is this policy applied", the second when a distribution
      must add up to total decisions.
    columns:
      - name: decision_policy_sk
        tests: [unique, not_null]
      - name: decision_sk
        tests:
          - not_null
          - relationships:
              to: ref('fct_decisions')
              field: decision_sk
      - name: policy_key
        tests:
          - relationships:
              to: ref('dim_policy')
              field: policy_key
      - name: policy_group_name
        description: Parent policy area where known, otherwise the policy's own name.
      - name: decision_count_allocated
        tests:
          - dbt_utils.accepted_range: { min_value: 0, max_value: 1, inclusive: true }

  - name: fct_job_actions
    description: >
      One row per job lifecycle movement. The fact for operational throughput — work moved
      rather than resolved, queue churn, and how much of the movement is automated.

      At most one actor key is populated per row: a reviewer OR a workflow. Actions with
      source `auto`, `api` or `agent` have neither.
    columns:
      - name: job_action_event_sk
        tests: [unique, not_null]
      - name: queue_key
        tests:
          - relationships:
              to: ref('dim_queue')
              field: queue_key
      - name: reviewer_key
        description: Null unless a human took the action.
        tests:
          - relationships:
              to: ref('dim_reviewer')
              field: reviewer_key
      - name: workflow_key
        description: Null unless a workflow took the action.
        tests:
          - relationships:
              to: ref('dim_workflow')
              field: workflow_key
      - name: actioned_at
        tests: [not_null]
      - name: job_action_count
        description: Always 1.
        tests: [not_null]
      - name: job_age_at_action_hours
        description: Job age when the action was taken. Null when creation time is absent.

  - name: fct_jobs
    description: >
      One row per job, whether or not it has closed. An accumulating snapshot: the row is
      rewritten as the job's lifecycle progresses.

      This is the only model that can answer the cross-event questions, because neither
      event alone carries both halves — actions know the movement history but not the
      outcome, closures know the outcome but not the movement history. Queue changes before
      closure, job age, handle time by queue and moderator, and automated close share all
      come from here.

      Like the rest of the marts this is a dynamic table, and like the rest of them it
      resolves to FULL refresh. For this model that is correct rather than a shortcoming: an
      accumulating snapshot mutates rows that already exist, so any incremental scheme has
      to re-derive every job touched anywhere in the window — a well-known source of subtly
      stale rows when the window is slightly too narrow. Check what any mart resolved to
      with SHOW DYNAMIC TABLES IN SCHEMA CINDER_ANALYTICS.MARTS and read refresh_mode_reason.

      KNOWN UNDERCOUNT on closures: Cinder sends no `job.closed` when a job closes with zero
      decisions, so such a job appears here as permanently open. `is_open` is therefore
      "no closure event seen", not "definitely still in the queue".
    columns:
      - name: job_key
        tests: [unique, not_null]
      - name: job_id
        tests: [unique, not_null]
      - name: final_queue_key
        tests:
          - relationships:
              to: ref('dim_queue')
              field: queue_key
      - name: entity_key
        tests:
          - relationships:
              to: ref('dim_entity')
              field: entity_key
      - name: final_reviewer_key
        description: Null for jobs closed automatically or not yet closed.
        tests:
          - relationships:
              to: ref('dim_reviewer')
              field: reviewer_key
      - name: job_status
        description: >
          `closed` when a closure was seen, otherwise the latest action's resulting status,
          otherwise `unknown`.
        tests: [not_null]
      - name: is_closed
        tests: [not_null]
      - name: is_open
        description: >
          No closure event was seen. Not the same as "still in the queue" — see the model
          description on the closure undercount.
        tests: [not_null]
      - name: queue_change_count
        description: >
          Queue changes before closure. Requires both events; zero for a job with no action
          history, which `missing_action_history` distinguishes from a genuine zero.
        tests:
          - not_null
          - dbt_utils.accepted_range: { min_value: 0, inclusive: true }
      - name: time_to_close_hours
        description: Creation to closure. Null for open jobs.
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
              severity: warn
      - name: handle_time_hours
        description: Creation to decision. Null for jobs with no decision.
      - name: time_to_first_action_seconds
        description: >
          Queue waiting time, as distinct from review time. Usually the larger of the two
          when a backlog is building.
      - name: decision_to_close_seconds
        description: >
          Time between the final decision and the job closing. A large value means the job
          sat open after the call was made — a different problem from slow review, and
          invisible if you only measure time to close.
      - name: missing_action_history
        description: >
          True when no `job.actioned` events were found for this job, which is expected when
          the action history predates the webhook subscription. Distinguishes a genuine zero
          from an unknown.
        tests: [not_null]
