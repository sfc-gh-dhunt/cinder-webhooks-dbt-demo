# =====================================================================================
# CI — validate every pull request against a real Snowflake account
# =====================================================================================
# Snowflake-native dbt has NO built-in CI/CD. Auto-deploy, PR validation and scheduled
# refresh are assembled from primitives: the project object, the snow CLI, EXECUTE DBT
# PROJECT and Tasks. This file is that assembly for pull requests; deploy.yml is the
# equivalent for merges.
#
# WHAT THIS DELIBERATELY DOES NOT DO: state-based selection. `--state`,
# `--select state:modified` and defer-to-production are not available on Snowflake-native
# dbt today, so every PR builds the whole project. At this size that is seconds. If your
# project grows past the point where a full build per PR is reasonable, the answer is to
# split the project, not to fake state comparison.
#
# EACH PR GETS ITS OWN SCHEMAS. The cinder_schema_prefix var (read by
# macros/generate_schema_name.sql) namespaces every schema by PR number, so concurrent PRs
# cannot overwrite each other's tables or each other's test results. They are dropped again
# at the end, including on failure.

name: CI

on:
  pull_request:
    branches: [main]
  # Manual trigger, for when you want to re-run validation without pushing an empty commit.
  workflow_dispatch:

# One CI run per PR. A new push cancels the previous run rather than queueing behind it —
# without this, a series of quick pushes leaves several builds racing for the same schemas.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # A SECRET, not a variable, so it is masked in run logs. Workflow logs are public on a
  # public repository, and a job-level `env:` is echoed in every step's environment block —
  # so an account identifier held as a variable is published on every run.
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_CI_USER }}
  SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_CI_ROLE }}
  SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
  SNOWFLAKE_DATABASE: CINDER_ANALYTICS
  # The external access integration that lets the deployed project resolve dbt packages.
  # A repository variable rather than a literal: rename the EAI in setup/01 and CI would
  # otherwise keep asking for the old name, while `make deploy` — which reads it from the
  # Makefile — carried on working. Falls back to the default so a fresh fork needs no setup.
  SNOWFLAKE_EAI: ${{ vars.SNOWFLAKE_EAI || 'CINDER_DEMO_DBT_EAI' }}
  # A per-PR project object, so CI never touches the production one.
  DBT_PROJECT_NAME: CINDER_WEBHOOKS_CI_PR${{ github.event.pull_request.number || 0 }}
  CI_SCHEMA_PREFIX: PR${{ github.event.pull_request.number || 0 }}_

jobs:

  # -----------------------------------------------------------------------------------
  # Job 1 — static validation. No warehouse, no credentials, no cost.
  # -----------------------------------------------------------------------------------
  # Everything here runs without touching Snowflake, which is why it runs first and on its
  # own: there is no reason to spin up compute to discover a missing comma.
  #
  # Linting works credential-free because sqlfluff is configured to use the JINJA templater
  # against the stub macros in .sqlfluff-stubs/. The dbt templater would compile the project
  # to resolve ref() and source(), and compilation opens a database connection.
  validate:
    name: Validate (no credentials)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-validate.txt

      - name: Install tooling
        run: pip install --quiet --requirement requirements-validate.txt

      - name: Lint SQL
        run: sqlfluff lint models tests --disable-progress-bar

      - name: Verify the seeds match their generator
        # The seeds are generated by a committed, deterministic script. If someone edits a CSV
        # by hand, the next regeneration silently reverts it — so the two are asserted to
        # agree here rather than left to diverge quietly.
        run: |
          python3 seeds/generate_seeds.py
          if ! git diff --quiet --exit-code seeds/cinder/; then
            echo "::error::Seed files do not match seeds/generate_seeds.py output."
            echo "Run 'python3 seeds/generate_seeds.py' and commit the result."
            git diff --stat seeds/cinder/
            exit 1
          fi

      - name: Install dbt packages
        # `dbt parse` refuses to run with packages declared but not installed, so deps has to
        # come first even though nothing here executes SQL. This resolves from the network, not
        # from Snowflake — which is why it belongs in the credential-free job.
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/.github/ci-profiles
        run: dbt deps

      - name: Parse the project
        # Structural validation with no database connection: catches broken refs, bad Jinja and
        # malformed YAML. The profile it reads carries no credentials and cannot connect.
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/.github/ci-profiles
        run: dbt parse --no-partial-parse

      - name: Check for private references
        # This repo is meant to be shareable. A customer name or account identifier committed
        # once is in the history for good, so it is checked mechanically.
        run: bash scripts/check_no_private_references.sh

      - name: Test the performance gate's check logic
        # The gate decides whether a merge is blocked, so its thresholds are tested rather than
        # trusted. The tests run against query plans RECORDED from a real account, which is why
        # they belong in this job: no connection, no warehouse, no cost.
        run: python -m pytest scripts/perf_gate/tests -q

  # -----------------------------------------------------------------------------------
  # Job 2 — build and test against Snowflake, in schemas owned by this PR.
  # -----------------------------------------------------------------------------------
  build:
    name: Build and test
    runs-on: ubuntu-latest
    # Waits on the performance gate as well as validation. The gate answers "will this be slow"
    # without spending anything, so there is no reason to pay for a build that a Cartesian join
    # has already condemned.
    needs: [validate, perf-gate]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-deploy.txt

      - name: Install Snowflake CLI
        run: pip install --quiet --requirement requirements-deploy.txt

      # ---- Authentication ---------------------------------------------------------
      # Key pair, held as a repository secret, belonging to a service user whose ONLY role is
      # the CI role. That scoping is the important part: a secret readable by any workflow in
      # the repository should not be able to do anything beyond build the demo schemas.
      #
      # The alternative — workload identity federation, with no long-lived secret at all — is
      # in deploy-oidc.yml.example and is the better choice for anything permanent.
      - name: Configure Snowflake connection
        run: |
          mkdir -p ~/.snowflake
          chmod 700 ~/.snowflake
          printf '%s' "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > ~/.snowflake/rsa_key.p8
          chmod 600 ~/.snowflake/rsa_key.p8
          cat > ~/.snowflake/connections.toml <<CONNTOML
          [ci]
          account = "$SNOWFLAKE_ACCOUNT"
          user = "$SNOWFLAKE_USER"
          role = "$SNOWFLAKE_ROLE"
          warehouse = "$SNOWFLAKE_WAREHOUSE"
          database = "$SNOWFLAKE_DATABASE"
          authenticator = "SNOWFLAKE_JWT"
          private_key_file = "$HOME/.snowflake/rsa_key.p8"
          CONNTOML
          chmod 600 ~/.snowflake/connections.toml

      - name: Verify the connection
        # Fail here with a clear message rather than three steps later inside a deploy.
        # Authentication problems are configuration problems and the downstream errors are poor.
        run: snow sql -c ci -q "SELECT CURRENT_USER() AS user, CURRENT_ROLE() AS role;"

      - name: Create the PR schemas
        run: |
          for layer in SEEDS STAGING MARTS SEMANTIC; do
            snow sql -c ci -q "CREATE SCHEMA IF NOT EXISTS ${SNOWFLAKE_DATABASE}.${CI_SCHEMA_PREFIX}${layer};"
          done

      - name: Point the profile at the CI role
        # profiles.yml names the production role, because that is right for the production
        # object and the field is mandatory. `snow dbt deploy` validates it against the
        # connecting role, so deploying as the CI user with that name in place fails.
        #
        # Rewritten here rather than solved by granting the CI user the production role, which
        # would defeat the separation, or by naming the CI role in the committed file, which
        # would make production deploy as CI. The edit exists only in this runner's checkout.
        run: |
          sed -i "s/^      role: .*/      role: ${SNOWFLAKE_ROLE}/" profiles.yml
          grep -E "^      role:" profiles.yml

      - name: Remove local dbt artifacts before deploying
        # dbt_packages/, package-lock.yml, target/ and logs/ must not be uploaded. The lock
        # file in particular is written by whichever dbt version ran locally, and a newer
        # format is rejected outright by the Snowflake-side dbt with a misleading
        # "packages.yml is malformed" error. Snowflake resolves packages itself at deploy.
        run: rm -rf dbt_packages package-lock.yml target logs

      - name: Deploy the project
        run: |
          snow dbt deploy "$DBT_PROJECT_NAME" \
            --connection ci \
            --source . \
            --database "$SNOWFLAKE_DATABASE" \
            --schema DBT \
            --external-access-integration "$SNOWFLAKE_EAI"

      - name: Build and test
        # `build`, not `run` then `test`: build interleaves each model with its own tests in
        # dependency order, so a downstream model is never built on top of a parent that just
        # failed. Running them separately publishes bad data first and complains afterwards.
        #
        # --full-refresh because the PR schemas are new every time, so every model is being
        # created from scratch regardless. For the dynamic table marts this makes dbt issue
        # CREATE OR REPLACE rather than trying to reconcile against a previous version that
        # does not exist in a fresh PR schema.
        #
        # ARGUMENT ORDER IS LOAD-BEARING. Everything after the `build` subcommand is forwarded
        # verbatim to dbt, so the CLI's own options have to come BEFORE the project name.
        # Putting --connection after `build` hands it to dbt, which ignores it, and the CLI
        # then falls back to the default connection and reports:
        #
        #   Connection default is not configured
        #
        # which says nothing about the real mistake.
        run: |
          snow dbt execute \
            --connection ci \
            --database "$SNOWFLAKE_DATABASE" \
            --schema DBT \
            "$DBT_PROJECT_NAME" build \
            --full-refresh \
            --vars "{\"cinder_schema_prefix\": \"$CI_SCHEMA_PREFIX\", \"cinder_source_mode\": \"seed\"}"

      - name: Verify the semantic view answers a question
        # Building a semantic view proves the DDL parsed. It does not prove the view answers
        # anything — a valid definition over a broken relationship returns zero rows without
        # error. So query it, and require a row back.
        run: |
          set -o pipefail
          snow sql -c ci --format json -q "
            SELECT COUNT(*) AS row_count FROM (
              SELECT * FROM SEMANTIC_VIEW(
                ${SNOWFLAKE_DATABASE}.${CI_SCHEMA_PREFIX}SEMANTIC.SEM_CINDER_MODERATION
                DIMENSIONS queues.queue_name
                METRICS decisions.total_decisions
              )
            );
          " > sv.json
          cat sv.json
          python3 - <<'PY'
          import json, sys
          rows = json.load(open('sv.json'))
          count = int(rows[0]['ROW_COUNT'])
          if count < 1:
              sys.exit("The semantic view returned no rows. Check the relationships.")
          print(f"Semantic view returned {count} grouped rows.")
          PY

      # ---- Teardown ---------------------------------------------------------------
      # always(), so a failed build does not leave schemas and a project object behind. CI
      # debris accumulates silently and is only noticed when someone reads a storage bill.
      - name: Drop the PR schemas and project
        if: always()
        run: |
          for layer in SEEDS STAGING MARTS SEMANTIC; do
            snow sql -c ci -q "DROP SCHEMA IF EXISTS ${SNOWFLAKE_DATABASE}.${CI_SCHEMA_PREFIX}${layer} CASCADE;" || true
          done
          snow dbt drop "$DBT_PROJECT_NAME" \
            --connection ci --database "$SNOWFLAKE_DATABASE" --schema DBT || true

      - name: Remove credentials
        if: always()
        run: rm -rf ~/.snowflake

  # -----------------------------------------------------------------------------------
  # Job 3 — will this be slow in production? Answered without building anything.
  # -----------------------------------------------------------------------------------
  # THE PROBLEM THIS EXISTS FOR. Job 2 catches a model that is wrong. Nothing catches a model
  # that is correct and too slow — and on a project large enough that the CI build stops being
  # affordable, job 2 is the first thing to get skipped. The timeout is then discovered in
  # production instead.
  #
  # HOW IT AVOIDS THE BUILD. EXPLAIN compiles a statement and returns its query plan without
  # executing it: which micro-partitions each scan would touch, how many bytes that is, and
  # whether the optimiser resolved a join to a Cartesian product. It needs no running warehouse
  # and consumes cloud services credits only. The expensive question gets a cheap answer.
  #
  # WHY IT RUNS BEFORE JOB 2. The gate is most useful exactly where the build is unaffordable,
  # so it has to stand alone and report first. Job 2 waits on it.
  #
  # WHAT IT DELIBERATELY DOES NOT DO. It creates no schemas, deploys no project and runs no
  # model. It compiles, plans and comments. It also does not review SQL: style, naming and logic
  # belong to job 1 and to whatever code reviewer you run. A finding that would be equally true
  # without knowing the production table sizes is somebody else's job.
  perf-gate:
    name: Performance gate (no build)
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      # Only to post the findings comment. Nothing here writes code.
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate diffs against the MERGE BASE, so it needs history rather than a shallow
          # clone. Without this, git merge-base has nothing to work with and every file in the
          # repository looks changed.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-validate.txt

      - name: Install tooling
        # The dbt toolchain, NOT requirements-deploy.txt. The two pin incompatible Snowflake
        # connectors, which is why they are separate files. The gate needs dbt to compile and the
        # connector to run EXPLAIN, and both come from this one.
        run: pip install --quiet --requirement requirements-validate.txt

      # ---- Authentication ---------------------------------------------------------
      # Same key pair and same service user as job 2. What changed is AUTHORISATION, not
      # authentication: setup/08 grants that role SELECT on the production marts and staging
      # schemas plus IMPORTED PRIVILEGES on SNOWFLAKE for the historical baseline.
      #
      # So this job can read production analytics, and a workflow file is a file a contributor
      # can edit in a pull request. What keeps that safe is the tool allowlist further down, not
      # the grant.
      - name: Configure Snowflake connection
        run: |
          mkdir -p ~/.snowflake
          chmod 700 ~/.snowflake
          printf '%s' "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > ~/.snowflake/rsa_key.p8
          chmod 600 ~/.snowflake/rsa_key.p8
          cat > ~/.snowflake/connections.toml <<'CONNTOML'
          [ci]
          authenticator = "SNOWFLAKE_JWT"
          CONNTOML
          {
            echo "account = \"$SNOWFLAKE_ACCOUNT\""
            echo "user = \"$SNOWFLAKE_USER\""
            echo "role = \"$SNOWFLAKE_ROLE\""
            echo "warehouse = \"$SNOWFLAKE_WAREHOUSE\""
            echo "database = \"$SNOWFLAKE_DATABASE\""
            echo "private_key_file = \"$HOME/.snowflake/rsa_key.p8\""
          } >> ~/.snowflake/connections.toml
          chmod 600 ~/.snowflake/connections.toml

      - name: Compile the project against production
        # NO SCHEMA PREFIX HERE, AND THAT IS THE POINT. Job 2 rewrites schemas to PR<n>_* so a
        # pull request cannot touch production. This job compiles against PRODUCTION relation
        # names on purpose, because the value of the gate is production data volume. Pointed at a
        # freshly built empty PR schema, every scan reports one partition out of one and the
        # exercise proves nothing.
        #
        # compile, not run. It resolves ref() from the manifest and asks the database only
        # whether a relation exists — which is what decides whether an incremental model's
        # is_incremental() branch is reachable at all.
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/.github/analysis-profiles
          SNOWFLAKE_PRIVATE_KEY_PATH: /home/runner/.snowflake/rsa_key.p8
        run: |
          dbt deps
          dbt compile

      - name: Measure the plans
        # Deterministic: extracts the plans, joins them to table volumes and historical cost, and
        # applies the thresholds in .perf-gate.yml. No model involved. This step decides whether
        # the check fails, so it has to be reproducible and arguable-with, which an LLM verdict
        # would not be.
        #
        # continue-on-error so a blocking finding still gets explained in the comment before the
        # job fails. The exit code is re-applied in the last step.
        id: measure
        continue-on-error: true
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/.github/analysis-profiles
          SNOWFLAKE_PRIVATE_KEY_PATH: /home/runner/.snowflake/rsa_key.p8
        run: |
          python -m scripts.perf_gate \
            --base-ref "origin/${{ github.event.pull_request.base.ref || 'main' }}" \
            --connection ci \
            --warehouse "$SNOWFLAKE_WAREHOUSE"

      - name: Explain the findings
        # THE ALLOWLIST IS THE SECURITY CONTROL, not a convenience. This step runs with
        # credentials that can read production, so the agent gets Read, Grep and Glob and nothing
        # else: no Bash, so it cannot open a connection of its own; no Write and no Edit, so it
        # cannot modify the repository or stage anything for exfiltration.
        #
        # It does not write the comment file either. -o captures the model's final response,
        # which is why the prompt asks for the comment AS the response rather than as a file.
        #
        # --no-mcp because an MCP server is another tool surface to reason about. --max-turns as
        # a runaway ceiling. --private keeps the run out of conversation history.
        if: always()
        continue-on-error: true
        run: |
          cortex exec \
            --file .cortex/prompts/perf-review.md \
            --allowed "Read,Grep,Glob" \
            --no-mcp \
            --max-turns 12 \
            --private \
            -o pr-comment.md

      - name: Post the comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s pr-comment.md ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body-file pr-comment.md
          else
            echo "::warning::No comment produced. See the perf-gate artifact for the raw findings."
          fi

      - name: Upload the measurements
        # The audit trail, and not optional. When a threshold is argued about in three months the
        # raw plan is what settles it — and it is a point-in-time measurement of production, so it
        # cannot be reconstructed afterwards.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-gate-${{ github.event.pull_request.number || github.run_id }}
          path: |
            .perf-gate-out/
            pr-comment.md
          if-no-files-found: warn

      - name: Remove credentials
        if: always()
        run: rm -rf ~/.snowflake

      - name: Apply the gate
        # Last on purpose, so the comment and the artifact exist before the job fails. Non-zero
        # only for an unsuppressed finding whose check is listed under `blocking:` in
        # .perf-gate.yml — which is cartesian_join and nothing else by default.
        if: always() && steps.measure.outcome == 'failure'
        run: |
          echo "::error::The performance gate found a blocking issue. See the pull request comment."
          exit 1
