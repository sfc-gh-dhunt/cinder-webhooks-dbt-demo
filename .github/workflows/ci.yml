# =====================================================================================
# CI — validate every pull request against a real Snowflake account
# =====================================================================================
# Snowflake-native dbt has NO built-in CI/CD. Auto-deploy, PR validation and scheduled
# refresh are assembled from primitives: the project object, the snow CLI, EXECUTE DBT
# PROJECT and Tasks. This file is that assembly for pull requests; deploy.yml is the
# equivalent for merges.
#
# WHAT THIS DELIBERATELY DOES NOT DO: state-based selection. `--state`,
# `--select state:modified` and defer-to-production are not available on Snowflake-native
# dbt today, so every PR builds the whole project. At this size that is seconds. If your
# project grows past the point where a full build per PR is reasonable, the answer is to
# split the project, not to fake state comparison.
#
# EACH PR GETS ITS OWN SCHEMAS. The cinder_schema_prefix var (read by
# macros/generate_schema_name.sql) namespaces every schema by PR number, so concurrent PRs
# cannot overwrite each other's tables or each other's test results. They are dropped again
# at the end, including on failure.

name: CI

on:
  pull_request:
    branches: [main]
  # Manual trigger, for when you want to re-run validation without pushing an empty commit.
  workflow_dispatch:

# One CI run per PR. A new push cancels the previous run rather than queueing behind it —
# without this, a series of quick pushes leaves several builds racing for the same schemas.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_CI_USER }}
  SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_CI_ROLE }}
  SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
  SNOWFLAKE_DATABASE: CINDER_ANALYTICS
  DBT_PROJECT_NAME: CINDER_WEBHOOKS_CI_PR${{ github.event.pull_request.number }}
  CI_SCHEMA_PREFIX: PR${{ github.event.pull_request.number }}_

jobs:

  # -----------------------------------------------------------------------------------
  # Structural validation. No warehouse, no credentials, no cost.
  # -----------------------------------------------------------------------------------
  # Runs first and separately because it catches the majority of mistakes in seconds without
  # touching Snowflake.
  #
  # SQL LINTING IS NOT HERE, and the reason is worth knowing before you move it back.
  # sqlfluff's dbt templater compiles the project to resolve ref() and source(), and
  # compilation opens a database connection — so linting cannot run without credentials. The
  # alternative, the jinja templater, needs a parallel set of stub macros that drift from the
  # real ones and produce false failures. So linting lives in the build job below, where a
  # connection already exists.
  validate:
    name: Validate structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install tooling
        run: pip install --quiet dbt-core==1.11.* dbt-snowflake==1.11.*

      - name: Verify the seeds match their generator
        # The seeds are generated by a committed, deterministic script. If someone edits a
        # CSV by hand, the next regeneration silently reverts it — so the two are asserted
        # to agree here rather than left to diverge quietly.
        run: |
          python3 seeds/generate_seeds.py
          if ! git diff --quiet --exit-code seeds/cinder/; then
            echo "::error::Seed files do not match seeds/generate_seeds.py output."
            echo "Run 'python3 seeds/generate_seeds.py' and commit the result."
            git diff --stat seeds/cinder/
            exit 1
          fi

      - name: Parse the project
        # Structural validation with no database connection. Catches broken refs, bad Jinja
        # and malformed YAML.
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/.github/ci-profiles
        run: dbt parse --no-partial-parse

  # -----------------------------------------------------------------------------------
  # Build and test against Snowflake, in a schema namespace owned by this PR.
  # -----------------------------------------------------------------------------------
  build:
    name: Build and test
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install tooling
        run: |
          pip install --quiet snowflake-cli
          pip install --quiet dbt-core==1.11.* dbt-snowflake==1.11.* \
                              sqlfluff==3.* sqlfluff-templater-dbt

      # ---- Authentication ---------------------------------------------------------
      # Key pair, held as a repository secret. The alternative — workload identity
      # federation, with no long-lived secret at all — is in deploy-oidc.yml and is the
      # better choice for anything long-lived. This is here because it works everywhere and
      # needs no identity-provider configuration.
      #
      # The key is written to a file with restrictive permissions and removed in a step that
      # always runs, including on failure.
      - name: Configure Snowflake connection
        run: |
          mkdir -p ~/.snowflake
          chmod 700 ~/.snowflake
          printf '%s' "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > ~/.snowflake/rsa_key.p8
          chmod 600 ~/.snowflake/rsa_key.p8
          cat > ~/.snowflake/connections.toml <<CONNTOML
          [ci]
          account = "$SNOWFLAKE_ACCOUNT"
          user = "$SNOWFLAKE_USER"
          role = "$SNOWFLAKE_ROLE"
          warehouse = "$SNOWFLAKE_WAREHOUSE"
          database = "$SNOWFLAKE_DATABASE"
          authenticator = "SNOWFLAKE_JWT"
          private_key_file = "$HOME/.snowflake/rsa_key.p8"
          CONNTOML
          chmod 600 ~/.snowflake/connections.toml

      - name: Write a local dbt profile for linting
        # sqlfluff's dbt templater compiles the project, and compilation needs a profile that
        # can actually connect. Written outside the repository so the tracked profiles.yml
        # stays credential-free.
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<PROFILE
          cinder_webhooks:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: $SNOWFLAKE_ACCOUNT
                user: $SNOWFLAKE_USER
                role: $SNOWFLAKE_ROLE
                database: $SNOWFLAKE_DATABASE
                schema: PUBLIC
                warehouse: $SNOWFLAKE_WAREHOUSE
                private_key_path: $HOME/.snowflake/rsa_key.p8
                threads: 8
          PROFILE
          chmod 600 ~/.dbt/profiles.yml

      - name: Install dbt packages
        run: dbt deps

      - name: Lint SQL
        # After credentials, for the reason given on the validate job.
        run: sqlfluff lint models tests --disable-progress-bar

      - name: Create the PR schemas
        run: |
          for layer in SEEDS STAGING MARTS SEMANTIC; do
            snow sql -c ci -q "CREATE SCHEMA IF NOT EXISTS ${SNOWFLAKE_DATABASE}.${CI_SCHEMA_PREFIX}${layer};"
          done

      - name: Remove local dbt artifacts before deploying
        # dbt_packages/, package-lock.yml, target/ and logs/ must not be uploaded. The lock
        # file in particular is written by whichever dbt version ran locally, and a newer
        # format is rejected outright by the Snowflake-side dbt with a misleading
        # "packages.yml is malformed" error. Snowflake resolves packages itself at deploy.
        run: rm -rf dbt_packages package-lock.yml target logs

      - name: Deploy the project
        # Deploying under a PR-specific project name keeps CI entirely away from the
        # production project object. Nothing this job does can affect the scheduled run.
        run: |
          snow dbt deploy "$DBT_PROJECT_NAME" \
            --connection ci \
            --source . \
            --database "$SNOWFLAKE_DATABASE" \
            --schema DBT \
            --external-access-integration CINDER_DEMO_DBT_EAI

      - name: Build and test
        # `build`, not `run` then `test`: build interleaves each model with its own tests in
        # dependency order, so a downstream model is never built on top of a parent that just
        # failed. Running them separately publishes bad data first and complains afterwards.
        #
        # --full-refresh because the PR schemas are new every time. It also sidesteps the
        # class of bug where an incremental model's logic changed but its existing rows were
        # built by the old logic and look perfectly fine.
        run: |
          snow dbt execute "$DBT_PROJECT_NAME" build \
            --connection ci \
            --database "$SNOWFLAKE_DATABASE" \
            --schema DBT \
            --full-refresh \
            --vars "{\"cinder_schema_prefix\": \"$CI_SCHEMA_PREFIX\", \"cinder_source_mode\": \"seed\"}"

      - name: Verify the semantic view is queryable
        # Building a semantic view proves the DDL parsed. It does not prove the view answers
        # anything — a valid definition over a broken relationship returns zero rows without
        # error. So query it, and require rows back.
        run: |
          snow sql -c ci -q "
            SELECT COUNT(*) AS row_count FROM (
              SELECT * FROM SEMANTIC_VIEW(
                ${SNOWFLAKE_DATABASE}.${CI_SCHEMA_PREFIX}SEMANTIC.SEM_CINDER_MODERATION
                DIMENSIONS queues.queue_name
                METRICS decisions.total_decisions
              )
            ) HAVING COUNT(*) > 0;
          " --format json | tee result.json
          if ! grep -q "row_count" result.json; then
            echo "::error::The semantic view returned no rows. Check the relationships."
            exit 1
          fi

      # ---- Teardown ---------------------------------------------------------------
      # always(), so a failed build does not leave schemas and a project object behind. CI
      # debris accumulates silently and is only noticed when someone reads a storage bill.
      - name: Drop the PR schemas and project
        if: always()
        run: |
          for layer in SEEDS STAGING MARTS SEMANTIC; do
            snow sql -c ci -q "DROP SCHEMA IF EXISTS ${SNOWFLAKE_DATABASE}.${CI_SCHEMA_PREFIX}${layer} CASCADE;" || true
          done
          snow dbt drop "$DBT_PROJECT_NAME" \
            --connection ci --database "$SNOWFLAKE_DATABASE" --schema DBT || true

      - name: Remove credentials
        if: always()
        run: rm -rf ~/.snowflake ~/.dbt
